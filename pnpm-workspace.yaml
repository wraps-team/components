# pnpm 10+ reads settings from here, not the `pnpm` field in package.json.
overrides:
  '@types/react': '19.1.2'
  '@types/react-dom': '19.1.2'

# Dependency build scripts must be decided explicitly (pnpm 11 fails the
# install otherwise). sharp is Next's image optimizer; msw is a shadcn CLI
# dependency whose postinstall we don't need.
allowBuilds:
  sharp: true
  msw: false
